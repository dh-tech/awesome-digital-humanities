awesome:
  - changed-files:
      - any-glob-to-any-file: 'README.md'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '_layouts/**'
          - 'assets/**'
          - '_config.yml'
          - '404.md'
          - 'CODE_OF_CONDUCT.md'
          - 'CONTRIBUTING.md'
          - 'LICENSE'
          - 'SECURITY.md'
          - '.gitattributes'
          - '.gitignore'
